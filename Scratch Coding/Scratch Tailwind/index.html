<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Modal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-100">

    <main class="w-full max-w-4xl p-4">
        <article class="flex flex-col p-6 m-3 space-y-10 bg-white rounded-2xl shadow-2xl md:flex-row md:space-y-0 md:space-x-10 md:m-0 md:p-16 items-center">
            <div class="flex-shrink-0">
                <img src="./images/headphones.jpg" alt="Wireless EDM Gaming Headphones Quartz 2.0" class="mx-auto duration-200 w-60 hover:scale-105">
            </div>
            <div class="flex flex-col space-y-6 text-center md:text-left">
                <div>
                    <span class="inline-block px-4 py-2 text-sm text-white bg-black rounded-full">Free Shipping</span>
                </div>
                <h1 class="max-w-sm text-2xl font-medium text-slate-900">Wireless EDM Gaming Headphones Quartz 2.0</h1>
                <div class="flex flex-col space-y-2">
                    <p class="text-xl text-red-500"><s class="line-through">$899</s></p>
                    <p class="text-5xl font-bold">$699</p>
                    <p class="text-sm font-light text-gray-400">This offer is valid until April 3rd or as long as stock lasts!</p>
                </div>
                <div class="flex flex-col space-y-4 items-center md:items-start">
                    <button type="button" class="px-8 py-4 border border-blue-600 text-blue-600 cursor-pointer rounded-full hover:bg-blue-500 hover:border-blue-500 hover:text-white transition-all">
                        Add to cart
                    </button>
                    <div class="flex items-center space-x-3">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75" aria-hidden="true"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-400"></span>
                        </span>
                        <span class="text-sm text-green-400">50+ pcs in stock</span>
                    </div>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
