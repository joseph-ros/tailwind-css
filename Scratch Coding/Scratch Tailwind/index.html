<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Modal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen bg-slate-100">
        <div class="flex flex-col p-6 m-3 space-y-10 bg-white rounded-2xl shadow-2xl md:flex-row md:space-y-0 md:space-x-10 md:m-0 md:p-16">
            <div>
                <img src="./images/headphones.jpg" alt="Product Image" class="mx-auto duration-200 w-60 hover:scale-105">
            </div>
            <div class="flex flex-col space-y-6">
                <div class="flex flex-col mb-4 space-y-3 text-center md:text-left">
                    <div>
                        <div class="inine-block px-3 py-1 text-sm text-white bg-black rounded-full">Free Shipping</div>
                    </div>
                    <div class="max-w-sm text-2xl font-medium">Wireless EDM Gaming Headphones Quartz 2.0</div>
                    <div class="flex flex-col mb-4 space-y-3 text-center md:text-left">
                        <p class="text-xl line-through text-red-500">$899</p>
                        <p class="text-5xl font-bold">$699</p>
                        <p class="text-sm font-light text-gray-400">This offer is valid until April 3rd or as long as stock lasts!</p>
                    </div>
                    <div class="group">
                        <button>

                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
