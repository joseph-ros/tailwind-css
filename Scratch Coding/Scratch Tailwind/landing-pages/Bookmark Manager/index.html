<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="input.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script src="./script.js" defer></script>
</head>
<body class="overflow-x-hidden">
    <nav class="container relative p-6 mx-auto">
        <div class="flex items-center justify-between my-6 space-x-20">
            <div class="z-30">
                <img src="images/logo-bookmark.svg" alt="Logo" id="logo"/>
            </div>
            <div class="items-center hidden space-x-10 uppercase text-grayishBlue md:flex">
                <a href="#features" class="tracking-widest hover:text-softRed">Features</a>
                <a href="#download" class="tracking-widest hover:text-softRed">Download</a>
                <a href="#faq" class="tracking-widest hover:text-softRed">FAQ</a>
                <a href="#" class="px-8 py-2 text-white border-2 rounded-lg shadow-md bg-softRed border-softRed hover:text-softRed hover:bg-white">Login</a>
            </div>
            <button id="menu-btn" class="z-30 block md:hidden focus:outline-none hamburger">
                <span class="hamburger-top"></span>
                <span class="hamburger-middle"></span>
                <span class="hamburger-bottom"></span>
            </button>
        </div>
        <div id="menu" class="fixed inset-0 z-20 flex-col items-center self-end hidden w-full h-full px-6 py-1 pt-24 pb-4 tracking-widest text-white uppercase divide-y divide-gray-500 m-h-screen opacity-90 bg-veryDarkBlue">
            <div class="w-full py-3 text-center">
                <a href="#features" class="block hover:text-softRed">Features</a>
            </div>
            <div class="w-full py-3 text-center">
                <a href="#download" class="block hover:text-softRed">Download</a>
            </div>
            <div class="w-full py-3 text-center">
                <a href="#faq" class="block hover:text-softRed">FAQ</a>
            </div>
            <div class="w-full py-3 text-center">
                <a href="#" class="block hover:text-softRed">Login</a>
            </div>
        </div>
    </nav>
</body>
</html>
