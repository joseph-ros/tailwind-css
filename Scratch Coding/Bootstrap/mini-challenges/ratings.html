<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings</title>
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./ratings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container f-inter">
        <div class="card bg-light border-0 shadow-lg rounded-4 mt-5">
            <div class="card-body">
                <div class="row p-5">
                    <div class="col-7">
                        <h2 class="fw-bold">What others think about the product</h2>
                    </div>
                    <div class="col-5 mw-20">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="display-5 fw-semibold f-poppins">
                                    <i class="fa-solid fa-star text-warning"></i> 4.8
                                </h3>
                                <p class="text-center">Average Rating</p>
                            </div>
                        </div>
                    </div>
                    <div class="row px-5">
                        <div class="col-12">
                            <div class="input-group input-group-lg mt-5">
                                <span class="input-group-text rounded-start-5">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input type="text" class="form-control rounded-end-5" placeholder="Search Reviews...">
                            </div>
                        </div>
                    </div>
                    <div class="row p-5">
                        <div class="col-12 vstack gap-2">
                            <h3 class="f-poppins fw-semibold">Reviews</h3>
                            <div class="d-flex align-items-center gap-1 fw-semibold mt-5 ms-5">
                                <span>5.0</span> <i class="fa-solid fa-star text-warning"></i>
                                <div class="progress ms-3 rounded-pill" style="height: 1rem; width: 100%;">
                                    <div class="progress-bar bg-warning" style="width: 80%;" role="progressbar" aria-valuenow="80" aria-valuemin="100" aria-valuemax="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1 fw-semibold mt-5 ms-5">
                                <span>4.0</span> <i class="fa-solid fa-star text-warning"></i>
                                <div class="progress ms-3 rounded-pill" style="height: 1rem; width: 100%;">
                                    <div class="progress-bar bg-warning" style="width: 60%;" role="progressbar" aria-valuenow="60" aria-valuemin="100" aria-valuemax="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1 fw-semibold mt-5 ms-5">
                                <span>3.0</span> <i class="fa-solid fa-star text-warning"></i>
                                <div class="progress ms-3 rounded-pill" style="height: 1rem; width: 100%;">
                                    <div class="progress-bar bg-warning" style="width: 20%;" role="progressbar" aria-valuenow="20" aria-valuemin="100" aria-valuemax="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1 fw-semibold mt-5 ms-5">
                                <span>2.0</span> <i class="fa-solid fa-star text-warning"></i>
                                <div class="progress ms-3 rounded-pill" style="height: 1rem; width: 100%;">
                                    <div class="progress-bar bg-warning" style="width: 10%;" role="progressbar" aria-valuenow="10" aria-valuemin="100" aria-valuemax="0"></div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1 fw-semibold mt-5 ms-5">
                                <span>1.0</span> <i class="fa-solid fa-star text-warning"></i>
                                <div class="progress ms-3 rounded-pill" style="height: 1rem; width: 100%;">
                                    <div class="progress-bar bg-warning" style="width: 30%;" role="progressbar" aria-valuenow="30" aria-valuemin="100" aria-valuemax="0"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row px-5 pb-4">
                        <div class="col-12">
                            <a href="#" class="btn btn-warning btn-lg rounded-pill text-light mt-5">Leave a Review</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div style="margin-top: 70px"></div>
</body>
<script src="/bootstrap.bundle.min.js"></script>
</html>
